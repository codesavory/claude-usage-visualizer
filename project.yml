name: ClaudeUsageVisualizer
options:
  bundleIdPrefix: dev.claudeusagevisualizer
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

targets:
  ClaudeUsageVisualizer:
    type: application
    platform: macOS
    sources:
      - path: ClaudeUsageVisualizer
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudeusagevisualizer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ClaudeUsageVisualizer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClaudeUsageVisualizer/Resources/ClaudeUsageVisualizer.entitlements
        # Signed with the Apple Developer team (automatic) so the app can carry
        # the iCloud key-value-store entitlement and share the OAuth token with
        # the iPhone app. The token now lives in a plain 0600 file, not a keychain
        # item, so changing the signing identity no longer triggers the old
        # login-password prompt (that was the reason for the earlier self-signed
        # identity, which is no longer needed).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C9BQ4L3K7L
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ClaudeUsageVisualizerIOS:
    type: application
    platform: iOS
    sources:
      - path: ClaudeUsageVisualizerIOS
        excludes:
          - "**/*.entitlements"
      - path: ClaudeUsageVisualizer/Services/OAuthEndpoint.swift
      - path: ClaudeUsageVisualizer/Services/OAuthUsageClient.swift
      - path: ClaudeUsageVisualizer/Services/CredentialsManager.swift
      - path: ClaudeUsageVisualizer/Services/OAuthLoginService.swift
      - path: ClaudeUsageVisualizer/Models/OAuthUsageSnapshot.swift
      - path: ClaudeUsageVisualizer/Utilities/BiometricCredentialStore.swift
      - path: ClaudeUsageVisualizer/Utilities/ICloudTokenSync.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudeusagevisualizer.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C9BQ4L3K7L
        CODE_SIGN_ENTITLEMENTS: ClaudeUsageVisualizerIOS/ClaudeUsageVisualizerIOS.entitlements

  ClaudeUsageVisualizerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudeUsageVisualizerTests
    dependencies:
      - target: ClaudeUsageVisualizer
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: true
