name: ClaudeUsageVisualizer
options:
  bundleIdPrefix: dev.claudeusagevisualizer
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

targets:
  ClaudeUsageVisualizer:
    type: application
    platform: macOS
    sources:
      - path: ClaudeUsageVisualizer
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudeusagevisualizer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ClaudeUsageVisualizer/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClaudeUsageVisualizer/Resources/ClaudeUsageVisualizer.entitlements
        # Sign with a stable self-signed identity (valid to 2036) instead of
        # ad-hoc. Ad-hoc changes the code hash every rebuild, which invalidates
        # the keychain ACL on the app's own credential item and forces a fresh
        # login-password prompt after each reinstall. A stable identity keeps a
        # constant designated requirement, so keychain ownership survives
        # rebuilds and the prompt never recurs.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "md-local-signing"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ClaudeUsageVisualizerIOS:
    type: application
    platform: iOS
    sources:
      - path: ClaudeUsageVisualizerIOS
      - path: ClaudeUsageVisualizer/Services/OAuthEndpoint.swift
      - path: ClaudeUsageVisualizer/Services/OAuthUsageClient.swift
      - path: ClaudeUsageVisualizer/Services/CredentialsManager.swift
      - path: ClaudeUsageVisualizer/Services/OAuthLoginService.swift
      - path: ClaudeUsageVisualizer/Models/OAuthUsageSnapshot.swift
      - path: ClaudeUsageVisualizer/Utilities/BiometricCredentialStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudeusagevisualizer.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C9BQ4L3K7L

  ClaudeUsageVisualizerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudeUsageVisualizerTests
    dependencies:
      - target: ClaudeUsageVisualizer
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: true
